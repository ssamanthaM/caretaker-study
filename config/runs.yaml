# What gets run. Seeds are shared by every cell, so every caretaker faces the
# identical dog and events. Calibration uses separate seeds so the dog is not
# tuned on the exact seeds the study reports.

phases:
  pilot:
    seeds: [11, 12, 13]
    conditions: [control, constitutional]
    models: [anthropic]          # Claude Fable 5.1 (chosen 2026-09-18)
  pilot_extension:
    seeds: [11, 12, 13]
    conditions: [control, constitutional]
    models: [openai, anthropic, google, xai]
  full:
    seeds: [11, 12, 13, 14, 15]
    conditions: [control, reward_feedback, constitutional, assistance_game, scalable_oversight]
    models: [openai, anthropic, google, xai]

calibration_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]

# Exact Inspect model IDs. "Current flagship" (preregistration, Models) means
# each vendor's most capable generally available model on the date it is first
# run; restricted-access models don't qualify. The run log records the ID and
# access date.
#
# No automatic fallbacks: if a provider refuses or errors, that is logged as
# such. Silently switching to another model would put a different model's
# output under this model's name.
models:
  openai: openai/gpt-6-astra              # GPT-6 Astra, chosen 2026-09-19
  anthropic: anthropic/claude-fable-5-1   # Claude Fable 5.1, chosen 2026-09-18
  google: google/gemini-3.8-flash         # Gemini 3.8 Flash, chosen 2026-09-19: Google's newest
                                          # stable model (its Pro 3.1 is preview, so not generally available)
  xai: grok/grok-4.6                      # Grok 4.6, chosen 2026-09-19: xAI's flagship, GA
  mock: mockllm/model

# USD per million tokens, used only for the cost estimate printed before a real
# run. Check the vendor's current prices before approving a run. Thinking
# tokens are billed as output.
pricing:
  # cache_write / cache_read: prompt-caching rates. Fable 5.1's cache read is
  # $0.25/M; the cache-write rate assumes Anthropic's usual 1.25x of input.
  anthropic: {input: 10.0, output: 50.0, cache_write: 12.5, cache_read: 0.25, as_of: 2026-06-24}   # Claude Fable 5.1
  openai: {input: 10.0, output: 50.0, as_of: 2026-09-19}      # GPT-6 Astra
  google: {input: 0.75, output: 3.75, cache_read: 0.075, as_of: 2026-09-19}   # Gemini 3.8 Flash; doubles from 2027-01-01
  xai: {input: 2.0, output: 6.0, cache_read: 0.5, as_of: 2026-09-19}   # Grok 4.6, prompts under 200k tokens

# Environment variable holding each vendor's API key (read from .env).
api_key_env:
  anthropic: ANTHROPIC_API_KEY
  openai: OPENAI_API_KEY
  google: GOOGLE_API_KEY
  xai: XAI_API_KEY

# The fixed grader for honesty and handover (preregistration: one fixed grader
# model scores every cell), and the second grader that re-grades a sample from
# another vendor. Values are keys of `models` above; fill in before grading.
grader:
  primary: openai           # chosen 2026-09-19: not Anthropic, so the pilot isn't self-graded
  second: google
  second_sample: 0.2        # share of items the second grader re-scores
  handscore_share: 0.10     # share of graded items exported for hand-scoring
  sample_seed: 2026         # seeds both samples, so they are reproducible

# Guards against silent hangs. Inspect treats "no credits remaining" as a rate
# limit and would otherwise retry forever, so cap the retries and give each run
# and each API call a wall-clock limit.
limits:
  api_max_retries: 3
  api_timeout_s: 300        # per model call
  sample_time_limit_s: 1800 # per run (a 30-day run takes about 5 minutes)
  grading_time_limit_s: 300 # per graded item
