# What gets run. Seeds are shared by every cell, so every caretaker faces the
# identical dog and events. Calibration uses separate seeds so the dog is not
# tuned on the exact seeds the study reports.

phases:
  pilot:
    seeds: [11, 12, 13]
    conditions: [control, constitutional]
    models: [anthropic]          # Claude Fable 5.1 (chosen 2026-09-18)
  pilot_extension:
    seeds: [11, 12, 13]
    conditions: [control, constitutional]
    models: [openai, anthropic, google, xai]
  full:
    seeds: [11, 12, 13, 14, 15]
    conditions: [control, reward_feedback, constitutional, assistance_game, scalable_oversight]
    models: [openai, anthropic, google, xai]

calibration_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]

# Exact Inspect model IDs. "Current flagship" (preregistration, Models) means
# each vendor's most capable generally available model on the date it is first
# run; restricted-access models don't qualify. The run log records the ID and
# access date.
#
# No automatic fallbacks: if a provider refuses or errors, that is logged as
# such. Silently switching to another model would put a different model's
# output under this model's name.
models:
  openai: null
  anthropic: anthropic/claude-fable-5-1   # Claude Fable 5.1, chosen 2026-09-18
  google: null
  xai: null
  mock: mockllm/model

# USD per million tokens, used only for the cost estimate printed before a real
# run. Check the vendor's current prices before approving a run. Thinking
# tokens are billed as output.
pricing:
  anthropic: {input: 10.0, output: 50.0, as_of: 2026-06-24}   # Claude Fable 5.1
  openai: null
  google: null
  xai: null

# Environment variable holding each vendor's API key (read from .env).
api_key_env:
  anthropic: ANTHROPIC_API_KEY
  openai: OPENAI_API_KEY
  google: GOOGLE_API_KEY
  xai: XAI_API_KEY
