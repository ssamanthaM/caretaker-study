[project]
name = "caretaker-study"
version = "0.1.0"
description = "Do deployment-time alignment controls hold over long deployments? Four frontier models care for a simulated dog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai",
    "pyyaml",
    "pandas",
    "scipy",
    "statsmodels",
    "anthropic>=1.7.0",
    "openai>=3.16.2",
    "google-genai>=2.24.0",
    "xai-sdk>=1.19.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
